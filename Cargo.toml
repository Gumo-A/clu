[package]
name = "cli-utils"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cliu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
libc = "0.2.186"
rand = "0.10.1"
regex = "1.12.3"
serde_json = "1.0.149"
similar = "3.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
